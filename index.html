 <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO MERCY</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
overflow:hidden;
}

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:-1;
}

header{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

h1{
font-size:90px;
color:#ff0000;
text-shadow:0 0 20px red,0 0 60px red;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{transform:scale(.98);}
to{transform:scale(1.02);}
}

p{
font-size:24px;
margin:20px 0;
}

.discord{
padding:16px 45px;
background:#ff0000;
color:white;
text-decoration:none;
border-radius:40px;
font-size:20px;
transition:.3s;
}

.discord:hover{
background:white;
color:red;
}

#intro{
position:fixed;
inset:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
transition:1s;
}

#intro.hide{
opacity:0;
visibility:hidden;
}

.loader{
width:220px;
height:5px;
background:#222;
margin-top:30px;
overflow:hidden;
border-radius:20px;
}

.loader::before{
content:"";
display:block;
height:100%;
background:red;
animation:load 3s forwards;
}

@keyframes load{
from{width:0;}
to{width:100%;}
}
</style>
</head>

<body>

<div id="intro">
<h1>NO MERCY</h1>
<p>Sadakat • Güç • Saygı</p>
<div class="loader"></div>
</div>

<video autoplay muted loop playsinline id="bgVideo">
<source src="background.mp4" type="video/mp4">
</video>

<header>
<h1>NO MERCY</h1>
<p>Sadakat • Güç • Saygı</p>

<a class="discord"
href="https://discord.gg/EeUYJevZ4Z"
target="_blank">
Discord'a Katıl
</a>

</header>

<audio id="music" autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
window.onload=function(){

setTimeout(function(){
document.getElementById("intro").classList.add("hide");
},3000);

const music=document.getElementById("music");

music.play().catch(()=>{
document.addEventListener("click",()=>{
music.play();
},{once:true});
});

};
</script>

</body>
</html>
